[project]
name = "csv-importer"
version = "0.0.1"
requires-python = ">= 3.10"
dependencies = [
    "alembic==1.13.1",
    "cache-decorator==2.2.0",
    "pandas==2.2.2",
    "polars>=2.0.0",
    "psycopg2-binary==2.9.9",
    "pyarrow>=25.0.1",
    "requests==2.31.0",
    "sparqlwrapper==2.0.0",
    "sqlalchemy==1.4.52",
]

[tool.setuptools]
packages = [ "csv_importer" ]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
